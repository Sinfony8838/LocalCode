<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Notes</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 0; display: grid; place-items: start center; }
  main { background: #fff; width: min(860px, 100vw - 24px); margin: 24px 0; padding: 16px 20px; border-radius: 10px; box-shadow: 0 2px 10px #0001; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
  button { font-size: .9rem; padding: 6px 12px; cursor: pointer; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .panes { grid-template-columns: 1fr; } }
  #editor { width: 100%; box-sizing: border-box; min-height: 300px; font: .95rem/1.5 ui-monospace, monospace; padding: 10px; }
  #preview { border: 1px dashed #ccc; border-radius: 6px; min-height: 300px; padding: 10px; overflow-wrap: anywhere; }
  #preview pre { white-space: pre-wrap; }
  #preview code { background: #f0f0f2; border-radius: 4px; padding: 1px 4px; }
  .status { display: flex; gap: 14px; align-items: baseline; margin-top: 8px; color: #556; font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Markdown Notes</h1>
  <div class="toolbar">
    <button id="save-note" type="button">Save</button>
    <button id="btn-clear" type="button">Clear</button>
  </div>
  <div class="panes">
    <textarea id="editor" placeholder="# Heading" aria-label="markdown source"></textarea>
    <div id="preview" aria-live="polite"></div>
  </div>
  <div class="status"><span id="word-count">0 words</span><span id="save-status"></span></div>
</main>
<script>
  'use strict';
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const wordCount = document.getElementById('word-count');
  const saveStatus = document.getElementById('save-status');

  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function renderInline(text) {
    let out = escapeHtml(text);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    return out;
  }

  function renderMarkdown(src) {
    const html = [];
    let list = null;
    const closeList = () => { if (list) { html.push(`</${list}>`); list = null; } };
    for (const rawLine of String(src).split(/\r?\n/)) {
      const line = rawLine.trimEnd();
      let m;
      if ((m = /^###\s+(.*)$/.exec(line))) { closeList(); html.push(`<h3>${renderInline(m[1])}</h3>`); }
      else if ((m = /^##\s+(.*)$/.exec(line))) { closeList(); html.push(`<h2>${renderInline(m[1])}</h2>`); }
      else if ((m = /^#\s+(.*)$/.exec(line))) { closeList(); html.push(`<h1>${renderInline(m[1])}</h1>`); }
      else if ((m = /^-\s+(.*)$/.exec(line))) {
        if (list !== 'ul') { closeList(); html.push('<ul>'); list = 'ul'; }
        html.push(`<li>${renderInline(m[1])}</li>`);
      } else if ((m = /^\d+\.\s+(.*)$/.exec(line))) {
        if (list !== 'ol') { closeList(); html.push('<ol>'); list = 'ol'; }
        html.push(`<li>${renderInline(m[1])}</li>`);
      } else if (line.trim() === '') {
        closeList();
      } else {
        closeList();
        html.push(`<p>${renderInline(line)}</p>`);
      }
    }
    closeList();
    return html.join('');
  }

  function render() {
    preview.innerHTML = renderMarkdown(editor.value);
    const trimmed = editor.value.trim();
    wordCount.textContent = `${trimmed ? trimmed.split(/\s+/).length : 0} words`;
  }

  editor.addEventListener('input', render);

  document.getElementById('save-note').addEventListener('click', () => {
    localStorage.setItem('note', editor.value);
    saveStatus.textContent = 'Saved';
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    editor.value = '';
    render();
  });

  const saved = localStorage.getItem('note');
  if (saved !== null) editor.value = saved;
  render();
</script>
</body>
</html>
