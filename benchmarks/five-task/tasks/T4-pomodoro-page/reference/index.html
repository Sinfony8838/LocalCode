<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<style>
  body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { text-align: center; padding: 16px; max-width: 360px; }
  #time { font-size: 4rem; font-variant-numeric: tabular-nums; margin: 0 0 16px; }
  button { font-size: 1rem; padding: 8px 16px; margin: 4px; }
</style>
</head>
<body>
<main>
  <h1 id="time">25:00</h1>
  <div><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></div>
  <p id="status" aria-live="polite"></p>
</main>
<script>
  const total = 25 * 60; let remaining = total; let timer = null;
  const time = document.getElementById('time'); const status = document.getElementById('status');
  const render = () => { const m = String(Math.floor(remaining / 60)).padStart(2, '0'); const s = String(remaining % 60).padStart(2, '0'); time.textContent = m + ':' + s; };
  const stop = () => { if (timer !== null) { clearInterval(timer); timer = null; } };
  document.getElementById('start').addEventListener('click', () => {
    if (timer !== null || remaining === 0) return;
    status.textContent = '';
    timer = setInterval(() => { remaining -= 1; render(); if (remaining === 0) { stop(); status.textContent = 'Break time!'; } }, 1000);
  });
  document.getElementById('pause').addEventListener('click', stop);
  document.getElementById('reset').addEventListener('click', () => { stop(); remaining = total; status.textContent = ''; render(); });
  render();
</script>
</body>
</html>
