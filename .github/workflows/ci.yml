name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/release_scan.py --self-test
      - run: python scripts/release_scan.py
      - name: Scan Git history for secrets
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $target = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          & (Join-Path $target 'gitleaks.exe') git --redact --no-banner .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
        working-directory: LocalCode/source
      - run: npm run typecheck
        working-directory: LocalCode/source
      - run: npm test -- --no-file-parallelism
        working-directory: LocalCode/source
      - run: npm run build
        working-directory: LocalCode/source
      - name: Verify turn summaries and embedded artifacts in Electron
        run: node scripts/acceptance-artifacts.mjs
        working-directory: LocalCode/source
      - run: npm audit --omit=dev --audit-level=high
        working-directory: LocalCode/source
