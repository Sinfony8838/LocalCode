name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/release_scan.py --self-test
      - run: python scripts/release_scan.py
      - name: Scan Git history for secrets
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $target = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          & (Join-Path $target 'gitleaks.exe') git --redact --no-banner .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check setup without downloads (Windows PowerShell 5.1)
        id: setup51
        continue-on-error: true
        shell: powershell
        run: .\scripts\Test-Setup.ps1
      - name: Check setup without downloads (PowerShell 7)
        id: setup7
        continue-on-error: true
        shell: pwsh
        run: .\scripts\Test-Setup.ps1
      - name: Test portable package allowlist
        run: node --test scripts/tests/portable-bundle.test.mjs
      - run: npm ci
        working-directory: LocalCode/source
      - run: npm run typecheck
        working-directory: LocalCode/source
      - run: npm test -- --no-file-parallelism
        id: unit_tests
        continue-on-error: true
        working-directory: LocalCode/source
      - run: npm run build
        working-directory: LocalCode/source
      - name: Verify turn summaries and embedded artifacts in Electron
        id: artifact_ui
        continue-on-error: true
        run: node scripts/acceptance-artifacts.mjs
        working-directory: LocalCode/source
      - name: Verify first-run model setup in Electron
        id: model_ui
        continue-on-error: true
        run: node scripts/acceptance-model-setup.mjs
        working-directory: LocalCode/source
      - name: Verify conversation typography in Electron
        # Saved sample sessions only; no model requests.
        id: typography_ui
        continue-on-error: true
        run: node scripts/acceptance-typography.mjs
        working-directory: LocalCode/source
      - name: Verify user-approved external edit checkpoints
        id: checkpoint_ui
        continue-on-error: true
        run: node scripts/acceptance-checkpoint.mjs
        working-directory: LocalCode/source
      - run: npm audit --omit=dev --audit-level=high
        working-directory: LocalCode/source
      - name: Package Windows application
        run: npm run package
        working-directory: LocalCode/source
      - name: Verify the packaged desktop with isolated fixtures
        id: packaged_ui
        continue-on-error: true
        shell: pwsh
        working-directory: LocalCode/source
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/acceptance-artifacts.mjs "../app/releases/$version/LocalCode-win32-x64/LocalCode.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/acceptance-typography.mjs "../app/releases/$version/LocalCode-win32-x64/LocalCode.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable download and checksums
        shell: pwsh
        run: |
          $version = (Get-Content LocalCode/source/package.json -Raw | ConvertFrom-Json).version
          $name = "LocalCode-$version-windows-x64"
          node scripts/portable-bundle.mjs "$env:RUNNER_TEMP/$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = "$env:RUNNER_TEMP/$name"
          function Snapshot-Bundle {
            (Get-ChildItem -LiteralPath $bundle -Recurse -Force | Sort-Object FullName | ForEach-Object { "$($_.FullName)|$($_.LastWriteTimeUtc.Ticks)|$(if (-not $_.PSIsContainer) { $_.Length })" }) -join "`n"
          }
          $before = Snapshot-Bundle
          $env:LOCALCODE_NO_PAUSE = '1'
          $plan = (& "$bundle/Install-LocalModel.cmd" -Plan | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $details = $plan | ConvertFrom-Json
          if ($details.mode -ne 'model-only' -or $details.buildsDesktop -ne $false) { throw 'Portable installer selected the wrong mode' }
          if ((Snapshot-Bundle) -ne $before) { throw 'Portable Plan modified the bundle' }
          $out = Join-Path $env:RUNNER_TEMP 'localcode-download'
          New-Item -ItemType Directory -Path $out | Out-Null
          Compress-Archive -LiteralPath "$env:RUNNER_TEMP/$name" -DestinationPath "$out/$name.zip"
          $hash = (Get-FileHash "$out/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$out/SHA256SUMS.txt"
      # Collect independent test failures in one run, but never make the job
      # green or publish a download unless every suite actually succeeded.
      - name: Require every setup and desktop test suite to pass
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.setup51.outcome }}' -ne 'success' -or '${{ steps.setup7.outcome }}' -ne 'success' -or '${{ steps.unit_tests.outcome }}' -ne 'success' -or '${{ steps.artifact_ui.outcome }}' -ne 'success' -or '${{ steps.model_ui.outcome }}' -ne 'success' -or '${{ steps.typography_ui.outcome }}' -ne 'success' -or '${{ steps.checkpoint_ui.outcome }}' -ne 'success' -or '${{ steps.packaged_ui.outcome }}' -ne 'success') {
            throw 'All setup, unit, source desktop and packaged desktop suites must pass. No download is published on failure.'
          }
      - name: Retain tested Windows download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LocalCode-windows-x64
          path: ${{ runner.temp }}/localcode-download/
          if-no-files-found: error
          retention-days: 14
